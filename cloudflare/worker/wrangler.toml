name = "livraison-api"
main = "src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "livraison-prod"
database_id = "d60dbbab-c35d-4984-acb5-dc1018fe56a6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wasla-livraison-media"

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
APP_NAME = "Wasla Livraison"
